[workspace]
members = ["crates/ecosim-core", "crates/ecosim-python"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/ctoth/ecosim"

[workspace.dependencies]
num-bigint = "0.4"
num-rational = "0.4"
num-traits = "0.2"
pyo3 = "0.27"
